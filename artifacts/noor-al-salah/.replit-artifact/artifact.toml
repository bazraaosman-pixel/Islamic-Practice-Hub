kind = "mobile"
previewPath = "/"
title = "نور الصلاة — Noor Al-Salah"
description = "A calm Arabic-first Islamic companion app for prayer times, Qibla, Quran, adhkar, tasbih, and daily spiritual routines."
version = "1.0.0"
id = "artifacts/noor-al-salah"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21994

[services.development]
run = "pnpm --filter @workspace/noor-al-salah run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/noor-al-salah", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/noor-al-salah", "run", "serve" ]

[services.env]
PORT = "21994"
BASE_PATH = "/"
